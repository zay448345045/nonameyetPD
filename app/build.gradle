apply plugin: 'com.android.application'

android {
    compileSdkVersion 35
    //29

    defaultConfig {
        applicationId "com.ravenwolf.nnypd"
        minSdkVersion 14
        targetSdkVersion 35
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}
dependencies {
    compile project(':libs')
}
